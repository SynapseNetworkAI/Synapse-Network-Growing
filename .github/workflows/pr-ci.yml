name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "CI scope to run"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - full

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      run_full: ${{ steps.scope.outputs.run_full }}
      run_backend: ${{ steps.scope.outputs.run_backend }}
      run_dashboard: ${{ steps.scope.outputs.run_dashboard }}
      run_docs: ${{ steps.scope.outputs.run_docs }}
      run_security: ${{ steps.scope.outputs.run_security }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify changed files
        id: scope
        run: |
          set -euo pipefail
          event_name="${{ github.event_name }}"
          requested_scope="${{ inputs.scope || 'auto' }}"
          if [[ "$event_name" == "push" || "$event_name" == "schedule" || "$requested_scope" == "full" ]]; then
            python scripts/ci/ci_scope.py --force-full --github-output --json pr-ci-scope.json
          else
            git fetch --quiet origin main
            python scripts/ci/ci_scope.py --base origin/main --github-output --json pr-ci-scope.json
          fi
      - name: Print scope
        run: cat pr-ci-scope.json

  full-checks:
    name: Full PR gate
    needs: scope
    if: needs.scope.outputs.run_full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install system quality tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Enable package managers
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dashboard dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard
      - name: Run full PR checks
        env:
          SYNAPSE_CI_SCOPE_FILE: pr-ci-scope.json
          SYNAPSE_CI_SCOPE: full
        run: bash scripts/ci/pr_checks.sh

  guardrails:
    name: Guardrails
    needs: scope
    if: needs.scope.outputs.run_full != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install ripgrep
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Run agent guardrails
        run: bash scripts/ci/agent_guardrails.sh

  backend-checks:
    name: Backend scoped checks
    needs: scope
    if: needs.scope.outputs.run_full != 'true' && needs.scope.outputs.run_backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install system quality tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Run backend scoped checks
        run: |
          git fetch --quiet origin main
          bash scripts/ci/backend_checks.sh origin/main

  dashboard-checks:
    name: Dashboard scoped checks
    needs: scope
    if: needs.scope.outputs.run_full != 'true' && needs.scope.outputs.run_dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - name: Install system quality tools
        run: |
          if command -v rg >/dev/null 2>&1; then
            rg --version
          else
            sudo apt-get update
            sudo apt-get install -y ripgrep
          fi
      - name: Enable package managers
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install dashboard dependencies
        run: yarn install --frozen-lockfile
        working-directory: dashboard
      - name: Run dashboard scoped checks
        run: |
          git fetch --quiet origin main
          bash scripts/ci/dashboard_checks.sh origin/main

  docs-checks:
    name: Docs scoped checks
    needs: scope
    if: needs.scope.outputs.run_full != 'true' && needs.scope.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Whitespace check
        run: |
          git fetch --quiet origin main
          git diff --check origin/main

  security-lite:
    name: Security lite
    needs: scope
    if: needs.scope.outputs.run_full != 'true' && needs.scope.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Run changed-file secret scan
        run: |
          git fetch --quiet origin main
          python scripts/ci/secret_diff_scan.py --base origin/main

  pr-required:
    name: pr-checks
    needs:
      - scope
      - full-checks
      - guardrails
      - backend-checks
      - dashboard-checks
      - docs-checks
      - security-lite
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate scoped CI result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = []
          for name, payload in needs.items():
              result = payload.get("result")
              print(f"{name}: {result}")
              if result in {"failure", "cancelled"}:
                  failed.append(f"{name}={result}")
          if failed:
              print("Scoped CI failed: " + ", ".join(failed), file=sys.stderr)
              raise SystemExit(1)
          print("Scoped CI passed.")
          PY
