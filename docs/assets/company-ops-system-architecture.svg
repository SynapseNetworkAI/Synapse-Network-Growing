<svg width="2600" height="1993" viewBox="0 0 1800 1380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="1380" rx="40" fill="#F6F1E7"/>
  <rect x="36" y="36" width="1728" height="1308" rx="30" fill="#FFFCF6" stroke="#DDCFB6" stroke-width="3"/>

  <text x="82" y="110" fill="#2C251C" font-size="44" font-family="Arial, Helvetica, sans-serif" font-weight="700">Synapse Company Ops System Architecture</text>
  <text x="82" y="154" fill="#7A6A59" font-size="24" font-family="Arial, Helvetica, sans-serif">Execution Agent generates. Verification Agent challenges. Harness runs evidence and controls self-repair.</text>

  <rect x="90" y="220" width="1620" height="150" rx="24" fill="#E7F1FF" stroke="#7EA9D7" stroke-width="3"/>
  <text x="130" y="280" fill="#1F3E5A" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">1. Portfolio Discovery</text>
  <text x="130" y="324" fill="#4A6D8D" font-size="24" font-family="Arial, Helvetica, sans-serif">Company Review → Optimization Signals → Requirement Pool</text>
  <text x="130" y="356" fill="#4A6D8D" font-size="20" font-family="Arial, Helvetica, sans-serif">Choose what matters now, rank it, and turn it into governed work.</text>

  <rect x="90" y="430" width="1020" height="220" rx="24" fill="#EEF4FF" stroke="#9CB0E8" stroke-width="3"/>
  <text x="130" y="490" fill="#263B63" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">2. Planning Layer</text>
  <text x="130" y="536" fill="#5B6E98" font-size="24" font-family="Arial, Helvetica, sans-serif">Acceptance Brief anchors Done Criteria and Scope.</text>
  <text x="130" y="570" fill="#5B6E98" font-size="24" font-family="Arial, Helvetica, sans-serif">Plan Agent writes implementation strategy, not final test commands.</text>
  <text x="130" y="604" fill="#5B6E98" font-size="24" font-family="Arial, Helvetica, sans-serif">Verification plan is late-bound after real diff and evidence exist.</text>
  <text x="130" y="636" fill="#5B6E98" font-size="20" font-family="Arial, Helvetica, sans-serif">Outputs: acceptance.md, plan.md, project/session scope, delivery intent.</text>

  <rect x="1150" y="430" width="560" height="220" rx="24" fill="#EAF7EE" stroke="#85BF99" stroke-width="3"/>
  <text x="1190" y="490" fill="#234936" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">3. Policy Guardrails</text>
  <text x="1190" y="536" fill="#547261" font-size="24" font-family="Arial, Helvetica, sans-serif">Project Policies</text>
  <text x="1190" y="570" fill="#547261" font-size="24" font-family="Arial, Helvetica, sans-serif">Capability Matrix</text>
  <text x="1190" y="604" fill="#547261" font-size="24" font-family="Arial, Helvetica, sans-serif">Interrupt Policy / Budget / Release Mode</text>
  <text x="1190" y="636" fill="#547261" font-size="20" font-family="Arial, Helvetica, sans-serif">Harness decides what the agent may do, pause, or publish.</text>

  <rect x="90" y="710" width="1620" height="240" rx="24" fill="#1E2535"/>
  <text x="130" y="776" fill="#F7F3EA" font-size="36" font-family="Arial, Helvetica, sans-serif" font-weight="700">4. Workflow Execution Layer</text>
  <text x="130" y="826" fill="#BEC8D8" font-size="24" font-family="Arial, Helvetica, sans-serif">Execution Agent implements, writes tests, runs self-checks, and reports evidence.</text>
  <text x="130" y="860" fill="#BEC8D8" font-size="24" font-family="Arial, Helvetica, sans-serif">Verification failures append verification_repair_* and resume the same runtime_session_id.</text>
  <text x="130" y="894" fill="#BEC8D8" font-size="24" font-family="Arial, Helvetica, sans-serif">Harness owns pause / resume / required command execution / retry budget / closeout.</text>
  <text x="130" y="928" fill="#BEC8D8" font-size="20" font-family="Arial, Helvetica, sans-serif">Key artifacts: acceptance.md, plan.md, verification_plan.md, verification_evidence.md, verification_result.md, runtime telemetry.</text>

  <rect x="90" y="1010" width="780" height="250" rx="24" fill="#FFF1F1" stroke="#DB8E96" stroke-width="3"/>
  <text x="130" y="1072" fill="#6B2A33" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">5. Recovery &amp; Incident Layer</text>
  <text x="130" y="1118" fill="#87535B" font-size="24" font-family="Arial, Helvetica, sans-serif">Auto self-repair budget is 2 verification failures per execution run.</text>
  <text x="130" y="1152" fill="#87535B" font-size="24" font-family="Arial, Helvetica, sans-serif">Third failure routes to human; manual retry resumes same session.</text>
  <text x="130" y="1186" fill="#87535B" font-size="24" font-family="Arial, Helvetica, sans-serif">Incident taxonomy handles runtime, repo, policy, and delivery blockers.</text>

  <rect x="930" y="1010" width="780" height="250" rx="24" fill="#EEF8F0" stroke="#89C59F" stroke-width="3"/>
  <text x="970" y="1072" fill="#254A36" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">6. Validation &amp; Portfolio Feedback</text>
  <text x="970" y="1118" fill="#567260" font-size="24" font-family="Arial, Helvetica, sans-serif">Verification Agent is the discriminator and never writes code or tests.</text>
  <text x="970" y="1152" fill="#567260" font-size="24" font-family="Arial, Helvetica, sans-serif">Harness required commands are authoritative evidence for final verdict.</text>
  <text x="970" y="1186" fill="#567260" font-size="24" font-family="Arial, Helvetica, sans-serif">Passed unlocks release; failed sends repair guidance back.</text>

  <rect x="1270" y="235" width="390" height="100" rx="18" fill="#FFF8E7" stroke="#D7B75E" stroke-width="3"/>
  <text x="1302" y="275" fill="#6E5617" font-size="26" font-family="Arial, Helvetica, sans-serif" font-weight="700">Agents-Memory</text>
  <text x="1302" y="307" fill="#8A7445" font-size="18" font-family="Arial, Helvetica, sans-serif">Provides long-lived context and constraints.</text>

