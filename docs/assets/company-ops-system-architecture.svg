  <path d="M1350 750L1366 768" stroke="#F0C15A" stroke-width="6" stroke-linecap="round"/>
  <rect x="1240" y="948" width="430" height="44" rx="16" fill="#FFF6D8" stroke="#DAB34B" stroke-width="2"/>
  <text x="1260" y="977" fill="#74560B" font-size="18" font-family="Arial, Helvetica, sans-serif">failed → same-session self-repair (max 2)</text>
  <path d="M1465 335V408" stroke="#D0B36C" stroke-width="6" stroke-linecap="round"/>
  <path d="M1465 408L1453 389" stroke="#D0B36C" stroke-width="6" stroke-linecap="round"/>
  <path d="M1465 408L1477 389" stroke="#D0B36C" stroke-width="6" stroke-linecap="round"/>
</svg>
